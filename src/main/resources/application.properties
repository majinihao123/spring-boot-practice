spring.application.name=demo
spring.config.import=optional:file:./.env.local.properties
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/auth_gateway?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:auth_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=demo-auth
app.jwt.expiration=PT2H

app.bootstrap-admin.username=${APP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
